<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARSAR Offline Investigation Dashboard</title>
<style>body{font:15px system-ui,sans-serif;max-width:1200px;margin:32px auto;padding:0 18px;color:#172033;background:#f6f8fb}h1{margin-bottom:4px}.sub{color:#526070}button{background:#174ea6;color:white;border:0;border-radius:6px;padding:9px 14px;font-weight:650;cursor:pointer}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.card{background:#fff;padding:14px 20px;border-radius:8px;box-shadow:0 1px 3px #ccd3dd;min-width:160px}.metric{font-size:26px;font-weight:750}table{width:100%;border-collapse:collapse;background:#fff;box-shadow:0 1px 3px #ccd3dd}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e9ef;vertical-align:top}th{background:#eaf0fb}.risk{font-weight:700;color:#a52a2a}.evidence{max-width:420px;white-space:normal}.muted{color:#637083}#status{margin:16px 0}</style></head>
<body><h1>MARSAR: Bitcoin Forensic Intelligence</h1><p class="sub">Local-only view of correlated P2P and blockchain evidence. Run the pipeline after upload or use the bundled dataset.</p>
<button onclick="run()">Run analysis</button> <button onclick="load()">Refresh</button><p id="status" class="muted">Loading local evidence…</p>
<div class="cards" id="cards"></div><h2>Prioritized investigative leads</h2><table><thead><tr><th>Risk</th><th>Target</th><th>Focus</th><th>Confidence</th><th>Why flagged</th></tr></thead><tbody id="alerts"></tbody></table>
<script>
const api='/api/v1'; const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{let [h,a]=await Promise.all([fetch('/health').then(r=>r.json()),fetch(api+'/alerts/ranked?limit=25').then(r=>r.json())]);let c=h.record_counts;cards.innerHTML=[['Transactions',c.transactions],['Entity clusters',c.unique_entity_clusters],['Alerts',c.investigative_alerts],['Watchlist seeds',c.watchlist_seeds]].map(x=>`<div class="card"><div class="metric">${x[1]}</div>${x[0]}</div>`).join('');alerts.innerHTML=a.alerts.map(x=>{let e=x.evidence?.risk_attribution||{};let why=[e.primary_anomalous_feature&&`Anomaly: ${e.primary_anomalous_feature}`,e.peeling_chain_evidence&&'Peeling pattern',e.mixer_evidence&&'CoinJoin-like structure',e.seed_taint_score&&`Taint: ${e.seed_taint_score}`,...(e.heuristic_triggers||[])].filter(Boolean).join('; ')||x.evidence?.alert_summary||'Model-derived risk';return `<tr><td class="risk">${x.risk_score.toFixed(3)}</td><td>${esc(x.target_type)}<br><code>${esc(x.target_identifier)}</code></td><td>${esc(x.primary_focus_area)}</td><td>${x.confidence.toFixed(3)}</td><td class="evidence">${esc(why)}</td></tr>`}).join('')||'<tr><td colspan="5">No alerts yet. Run analysis after ingesting a dataset.</td></tr>';status.textContent='Updated from the local SQLite evidence store.'}catch(e){status.textContent='Unable to load local API: '+e.message}}
async function run(){status.textContent='Running local clustering, anomaly detection, model inference and alert ranking…';try{let r=await fetch(api+'/pipeline/run',{method:'POST'}).then(x=>x.json());status.textContent=`Analysis complete: ${r.clusters_identified} clusters and ${r.alerts_generated} alerts.`;load()}catch(e){status.textContent='Pipeline failed: '+e.message}}
load();</script></body></html>
